[project]
name = "autoanki"
version = "0.1.0"
description = "Generate Anki flashcards from Chinese video content"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0",
    "webvtt-py>=0.5",
    "genanki>=0.13",
    "jieba>=0.42",
    "pyyaml>=6.0",
    "pypinyin>=0.50",
    "faster-whisper>=1.1",
]

[project.scripts]
autoanki = "autoanki.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoanki*"]
