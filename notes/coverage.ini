; What the notes check requires, declared rather than hardcoded, so adding a
; language or a directory cannot leave it silently unchecked.
;
;   directories  where code that a run or a build uses lives
;   suffixes     the file kinds that need covering
;   exclude      globs skipped inside those directories (tests are read beside
;                the code they test, so they need no note of their own)
;   registries   optional "module:attribute" pairs, each importable and giving
;                an iterable of paths that also counts as coverage

; Coverage starts narrow so the gate installs cleanly. Widened in PR-3 to
; cover every module under autoanki/ as decision notes are written for each.

[coverage]
directories = autoanki
suffixes = .py
exclude = */__init__.py, */__pycache__/*, autoanki/download.py, autoanki/subtitles.py, autoanki/clip.py, autoanki/translate.py, autoanki/ocr.py, autoanki/ocr_correct.py, autoanki/ocr_preprocessing.py, autoanki/cards.py, autoanki/cli.py, autoanki/ankiconnect.py, autoanki/hsk.py
registries =
