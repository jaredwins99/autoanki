# Pre-commit hooks — Correctness tenet.
# The docs-notes gate is the only hard rule right now. Standard hooks catch
# whitespace/EOF drift and oversize binary drops.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']  # allow the demo.gif; the .apkg is gitignored
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: notes-check
        name: notes check (structure and coverage)
        entry: bash correctness/hooks/notes-gate.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: notes-evidence
        name: notes check (re-runs finding evidence)
        entry: bash correctness/hooks/notes-gate.sh --evidence
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
